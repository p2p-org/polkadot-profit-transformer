name: ci

on:
  push:
    branches: ['mbelt3/stage']

jobs:
  docker:
    name: Build & update docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Login to GCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: https://europe-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCR_JSON_KEY }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          push: true
          context: ./main
          tags: europe-docker.pkg.dev/substrate-infra/images/mbelt3_preloader:${{ github.sha }}

      - name: Update Image Version
        id: imgupd
        uses: mikefarah/yq@e2f1d5ccf73239195bf92280cd47596751492449 # master
        with:
          cmd: |
            yq eval '.image.tag = "${{ github.sha }}"' -i .helm/values.yaml

      - name: Commit image changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: Apply image tag change
